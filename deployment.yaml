apiVersion: apps/v1
kind: Deployment

metadata:
  name: brain-tasks-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: brain-tasks

  template:
    metadata:
      labels:
        app: brain-tasks

    spec:
      containers:
        - name: brain-tasks
          image: $IMAGE_URI
          ports:
            - containerPort: 80
