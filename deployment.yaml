apiVersion: apps/v1
kind: Deployment

metadata:
  name: brain-tasks-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: brain-tasks

  template:
    metadata:
      labels:
        app: brain-tasks

    spec:
      containers:
        - name: brain-tasks
          image: 519607124329.dkr.ecr.ap-south-1.amazonaws.com/sundar-brain-tasks:v1
          ports:
            - containerPort: 80
